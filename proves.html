<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunter · Explosius RGB · quatre variants</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#16242a;font:14px system-ui,-apple-system,sans-serif;color:#e9f1ed}
#canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#ui{position:relative;z-index:1;pointer-events:none;padding:8px 12px 12px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;pointer-events:auto;margin:0 0 7px}
h1{font-size:18px;letter-spacing:.01em;margin:0;line-height:1.3}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.controls button,.controls a{border:1px solid #668579;background:#293b40;color:#e6f4eb;padding:7px 11px;border-radius:7px;font:600 12px system-ui;text-decoration:none;cursor:pointer}
.controls button.active{background:#b8d6a5;color:#17241e;border-color:#b8d6a5}
.controls button:focus-visible,.controls a:focus-visible{outline:2px solid #e5fdc8;outline-offset:2px}
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(210px,1fr));gap:10px;height:calc(100vh - 83px)}
.card{position:relative;border-radius:12px;border:1px solid #69858b6b;box-shadow:inset 0 0 0 1px #18262760;min-width:0;overflow:hidden;pointer-events:auto;cursor:grab;touch-action:pan-y}
.card.dragging{cursor:grabbing}
.tag{position:absolute;left:10px;top:10px;padding:5px 9px;border-radius:5px;background:#112128c9;font-weight:700;color:#d8f3d9;font-size:12px}
.info{position:absolute;bottom:8px;left:10px;right:10px;display:inline-block;max-width:95%;padding:7px 10px;border-radius:7px;background:#112128e8;line-height:1.35}
.info b{display:block;font-size:13px}
.info small{display:block;color:#bfd0c7;font-size:11px;margin-top:3px}
.hint{font-size:11px;margin:4px 0 0;color:#b0c8bd;text-align:right}
@media(max-width:720px){
  #ui{padding:9px}
  h1{font-size:16px}
  header{align-items:flex-start}
  #cards{grid-template-columns:1fr;grid-template-rows:repeat(4,280px);height:auto;margin-top:10px}
  .controls button,.controls a{padding:6px 8px}
  .hint{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <header>
    <h1>Explosius RGB · 4 variants del model 1</h1>
    <div class="controls" aria-label="Estat del model">
      <button type="button" id="pickup" class="active" aria-pressed="true">Al món</button>
      <button type="button" id="placed" aria-pressed="false">Col·locat</button>
      <a href="compounds-preview.html">Compounds 3D ↗</a>
    </div>
  </header>
  <div id="cards"></div>
  <p class="hint">Arrossega un model per girar-lo. Alterna entre l'objecte recollible i la càrrega col·locada.</p>
</div>
<script type="module">
import * as THREE from './vendor/three-r186.module.mjs';
import {createExplosiveConcept,explosiveConcepts} from './src/explosive-concepts.mjs?v=20261008-rgb-03';

const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x233942,1);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x243b43);
scene.add(new THREE.HemisphereLight(0xe2f2e7,0x42585a,2.0));
const sun=new THREE.DirectionalLight(0xffe5c5,2.5);
sun.position.set(-7,12,-9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x94c5e8,.8);
fill.position.set(6,6,5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x3b555a,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.17;scene.add(floor);
const plinth=new THREE.Mesh(new THREE.CylinderGeometry(2.18,2.32,.18,36),new THREE.MeshStandardMaterial({color:0x526264,metalness:.12,roughness:.9}));
plinth.position.y=-.08;plinth.receiveShadow=true;scene.add(plinth);
const plinthTop=new THREE.Mesh(new THREE.CylinderGeometry(2.10,2.10,.012,36),new THREE.MeshStandardMaterial({color:0x69766e,roughness:.92}));
plinthTop.position.y=.018;plinthTop.receiveShadow=true;scene.add(plinthTop);

const cardsEl=document.getElementById('cards'),models=[],cams=[],cards=[];
let mode='pickup';
let yaw=.2,dragged=false,dragX=0,dragStart=0;
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
explosiveConcepts.forEach((item,i)=>{
  const card=document.createElement('div');card.className='card';
  const tag=document.createElement('div');tag.className='tag';tag.textContent='PROPOSTA '+(i+1);
  const info=document.createElement('div');info.className='info';
  const title=document.createElement('b');title.textContent=item.name;
  const description=document.createElement('small');description.textContent=item.desc;
  info.append(title,description);card.append(tag,info);cardsEl.append(card);
  cards.push(card);

  const pair=[createExplosiveConcept(THREE,i,false),createExplosiveConcept(THREE,i,true)];
  for(const model of pair){model.scale.setScalar(1.58);scene.add(model)}
  models.push(pair);
  const cam=new THREE.OrthographicCamera(-3,3,2,-2,.1,90);
  cam.position.set(3.4,3.7,-6.1);cam.lookAt(0,1.05,0);
  cams.push(cam);

  card.addEventListener('pointerdown',e=>{
    dragged=true;dragX=e.clientX;dragStart=yaw;
    card.classList.add('dragging');card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove',e=>{
    if(dragged&&card.hasPointerCapture(e.pointerId)){yaw=dragStart+(e.clientX-dragX)*.009}
  });
  const finish=()=>{dragged=false;card.classList.remove('dragging')};
  card.addEventListener('pointerup',finish);
  card.addEventListener('pointercancel',finish);
  card.addEventListener('lostpointercapture',finish);
});
const pickupBtn=document.getElementById('pickup'),placedBtn=document.getElementById('placed');
function selectMode(next){
  mode=next;
  pickupBtn.classList.toggle('active',next==='pickup');
  placedBtn.classList.toggle('active',next==='placed');
  pickupBtn.setAttribute('aria-pressed',String(next==='pickup'));
  placedBtn.setAttribute('aria-pressed',String(next==='placed'));
}
pickupBtn.addEventListener('click',()=>selectMode('pickup'));
placedBtn.addEventListener('click',()=>selectMode('placed'));

let sizeW=0,sizeH=0;
function resize(){
  sizeW=window.innerWidth;sizeH=window.innerHeight;
  renderer.setSize(sizeW,sizeH,false);
}
window.addEventListener('resize',resize);resize();

function render(t){
  // Rotació pausada i subtil en mode «Al món»: la pantalla continua llegible.
  const drift=reducedMotion||dragged?0:Math.sin(t*.00045)*.15;
  const inWorld=mode==='pickup';
  models.forEach((pair,i)=>{
    pair[0].visible=false;pair[1].visible=false;
    const m=pair[inWorld?0:1];
    m.visible=true;
    m.rotation.y=yaw+drift;
    m.position.y=inWorld?.83+(reducedMotion?0:Math.sin(t*.002+i*.7)*.06):.67;
    if(i===0&&!inWorld)window.HUNTER_EXPLOSIVE_VISUALS.update(m,3-((t*.001)%3));
  });
  renderer.setScissorTest(true);
  const H=sizeH;
  cards.forEach((card,i)=>{
    const r=card.getBoundingClientRect();
    if(r.bottom<=0||r.top>=H)return;
    const x=Math.max(0,Math.floor(r.left)),top=Math.max(0,Math.floor(r.top)),
          right=Math.min(sizeW,Math.ceil(r.right)),bottom=Math.min(H,Math.ceil(r.bottom));
    if(right<=x||bottom<=top)return;
    const w=right-x,h=bottom-top,a=w/h;
    renderer.setViewport(x,H-bottom,w,h);
    renderer.setScissor(x,H-bottom,w,h);
    const cam=cams[i],vertical=Math.max(3.40,5.1/a);
    cam.left=-vertical*a/2;cam.right=vertical*a/2;
    cam.top=vertical/2;cam.bottom=-vertical/2;cam.updateProjectionMatrix();
    models.forEach((pair,j)=>{pair[0].visible=j===i&&inWorld;pair[1].visible=j===i&&!inWorld});
    renderer.render(scene,cam);
  });
  renderer.setScissorTest(false);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
