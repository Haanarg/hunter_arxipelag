<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunter · Proves de llanxa</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#6f8f9d;font-family:system-ui;color:#fff}
#ui{position:fixed;inset:0;pointer-events:none}
h1{position:absolute;top:12px;left:50%;transform:translateX(-50%);margin:0;font-size:21px;text-shadow:0 2px 5px #0009;white-space:nowrap}
#cards{position:absolute;inset:52px 12px 12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.card{position:relative;border:1px solid #ffffff70;border-radius:10px;box-shadow:inset 0 0 0 1px #0005;background:#0001}
.label{position:absolute;left:10px;bottom:9px;background:#10202ed9;padding:7px 10px;border-radius:7px;font-weight:700;text-shadow:0 1px 2px #000;max-width:88%}
.label small{display:block;font-weight:500;opacity:.84;margin-top:2px}
canvas{display:block;width:100%;height:100%}
@media(max-width:700px){h1{font-size:16px}.label{font-size:12px}.label small{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><h1>Llanxa militar · 4 propostes Three.js</h1><div id="cards"></div></div>
<script type="module">
import * as THREE from './vendor/three-r186.module.mjs';
import {createBoatConcept} from './src/boat-concepts.mjs';

const labels=[
  ['1 · Stealth A · Equilibrada','La més propera a la foto: proa afilada, casc facetat i cabina oberta central.'],
  ['2 · Stealth B · Proa llarga','Més baixa i agressiva, amb coberta davantera més llarga i perfil ràpid.'],
  ['3 · Stealth C · Compacta','Més curta i robusta, pensada per tenir molt bona lectura a escala de joc.'],
  ['4 · Stealth D · Patrullera pesada','Més ampla i protegida, amb costats alts i una presència més militar.']
];

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x7da0aa);
scene.add(new THREE.HemisphereLight(0xe4f4ff,0x263b42,1.55));
const sun=new THREE.DirectionalLight(0xffe2bd,2.2);sun.position.set(-10,15,-9);sun.castShadow=true;scene.add(sun);

// Pla d'aigua visual simple per donar context.
const water=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x406d7d,roughness:.3,metalness:.05}));
water.rotation.x=-Math.PI/2;water.position.y=-.22;water.receiveShadow=true;scene.add(water);

const cards=document.getElementById('cards'),cams=[],models=[];
labels.forEach((meta,i)=>{
  const model=createBoatConcept(THREE,i);
  model.rotation.y=.42;
  model.position.y=.02;
  scene.add(model);models.push(model);

  const cam=new THREE.PerspectiveCamera(32,1,.1,120);
  cam.position.set(10.4,6.3,-13.7);
  cam.lookAt(0,1.15,0);
  cams.push(cam);

  const card=document.createElement('div');card.className='card';
  const label=document.createElement('div');label.className='label';
  label.innerHTML=meta[0]+'<small>'+meta[1]+'</small>';
  card.append(label);cards.append(card);
});

function resize(){renderer.setSize(innerWidth,innerHeight,false)}
addEventListener('resize',resize);resize();

function loop(){
  const rects=[...cards.children].map(x=>x.getBoundingClientRect()),H=innerHeight;
  renderer.setScissorTest(true);
  rects.forEach((r,i)=>{
    renderer.setViewport(r.left,H-r.bottom,r.width,r.height);
    renderer.setScissor(r.left,H-r.bottom,r.width,r.height);
    cams[i].aspect=r.width/r.height;cams[i].updateProjectionMatrix();
    models.forEach((m,j)=>m.visible=i===j);
    renderer.render(scene,cams[i]);
  });
  models.forEach(m=>m.visible=true);
  renderer.setScissorTest(false);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
