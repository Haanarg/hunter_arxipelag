name: Efectes d'impacte de bales
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bullet-impact-fx.yml'
      - 'tests/bullet-impact-fx.cjs'
      - 'src/combat.js'
      - 'src/world-generation.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Impactes normals i reciclatge de partícules
        run: node tests/bullet-impact-fx.cjs
      - name: Comprovació existent d'animació de granades
        run: node tests/grenade-charge-pose.cjs
