name: Defenses pesades i soldats llançacoets
on:
  push:
    branches: [main]
    paths:
      - 'src/characters.js'
      - 'src/enemy-ai.js'
      - 'src/compound-generation.js'
      - 'tests/defense-weapons.cjs'
      - '.github/workflows/defense-weapons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weapons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Torre dual i llançacoets militars
        run: node tests/defense-weapons.cjs
      - name: Seguretat de tipus de projectil
        run: node tests/projectile-classes.cjs
      - name: Regressió d'armes
        run: node tests/weapon-classification.cjs
      - name: Generació de bases i patrulles
        run: node tests/compound-generation.cjs
      - name: IA i rutes
        run: node tests/enemy-navigation-world.cjs
