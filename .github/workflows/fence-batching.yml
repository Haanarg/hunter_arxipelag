name: Optimització filferrades i draw calls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fence-batching.yml'
      - 'src/game-core.js'
      - 'src/world-generation.js'
      - 'tests/fence-batching.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar filferrades reals i destrucció
        run: node tests/fence-batching.cjs
      - name: Validar generació de compounds
        run: node tests/compound-generation.cjs
