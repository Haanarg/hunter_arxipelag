name: Restriccions de botí als complexos
on:
  push:
    branches: [main]
    paths:
      - 'src/game-core.js'
      - 'src/world-generation.js'
      - 'src/compound-generation.js'
      - 'tests/loot-restrictions.cjs'
      - 'tests/compound-generation.cjs'
      - '.github/workflows/loot-restrictions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Botí de polvorins, tallers i hangars amb tres mapes
        run: node tests/loot-restrictions.cjs
      - name: Generació i objectes garantits
        run: node tests/compound-generation.cjs
      - name: Regresions de joc
        run: node tests/smoke.cjs
