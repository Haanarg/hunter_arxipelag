name: Diagnòstic de patrulles a avançades
on:
  push:
    branches: [main]
    paths:
      - 'tests/outpost-paths.cjs'
      - 'src/world-generation.js'
      - 'src/game-core.js'
      - '.github/workflows/outpost-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outpost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/outpost-paths.cjs
