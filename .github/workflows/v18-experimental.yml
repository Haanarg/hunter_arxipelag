name: Hunter V18 experimental branch validation
on:
  push:
    branches:
      - v18-total-legacy-rig-bake
concurrency:
  group: v18-experimental-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  v18-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:lab
      - run: npm run test:all
      - run: npm run check:version
      - run: npm run build && npm run check:build
      - run: node tests/runtime-bundle-parity.cjs
