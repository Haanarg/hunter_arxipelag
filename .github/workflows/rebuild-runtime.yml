name: Rebuild and verify Hunter runtime (push or manual)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/runtime-bundle.mjs' # no loop after committing the generated manifest
      - 'tools/build-runtime.cjs'
      - 'tools/sync-version.cjs'
      - 'tests/tower-sentries.mjs'
      - 'tests/coop-barrier-ram.mjs'
      - 'tests/hover-distribution.mjs'
      - 'tests/fragile-vehicle-fragments.mjs'
      - 'tests/touch-vehicle-horn.mjs'
      - 'tests/vehicle-special.cjs'
      - 'tests/compound-ground-surfaces.mjs'
      - 'tests/tank-motorcycle-death.cjs'
      - 'tests/standalone-port-parity.mjs'
      - 'tests/world-generation-matrix.cjs'
      - 'tests/coast-road-reservation.mjs'
      - 'tests/performance-copy-diagnostic.mjs'
      - 'tests/performance-live-diagnostic.cjs'
      - 'tests/ai-pressure-scheduling.cjs'
      - 'tests/enemy-navigation-remote-ground.cjs'
      - 'tests/enemy-sweep-elevation-vegetation.cjs'
      - 'tests/enemy-sweep-candidate-cache.cjs'
      - 'tests/enemy-route-probe-budget.cjs'
      - 'tests/simulation-pressure-budget.cjs'
      - '.github/workflows/rebuild-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-runtime-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pause performance diagnostic copy
        run: |
          node --check src/ui.js
          node tests/performance-copy-diagnostic.mjs
      - name: Check distant route decisions and collision-elevation parity
        run: |
          node --check src/enemy-navigation.js
          node tests/enemy-navigation-remote-ground.cjs
          node tests/enemy-sweep-elevation-vegetation.cjs
          node tests/enemy-sweep-candidate-cache.cjs
          node tests/enemy-route-probe-budget.cjs
          node tests/enemy-navigation.cjs
      - name: Check live FPS, captured diagnostics and overloaded AI
        run: |
          node --check src/performance.js
          node --check src/enemy-ai.js
          node --check src/game-core.js
          node --check src/simulation-clock.js
          node --check src/frame-diagnostics-core.mjs
          node tests/performance-live-diagnostic.cjs
          node tests/ai-pressure-scheduling.cjs
          node tests/simulation-pressure-budget.cjs
          node tests/ai-cpu-optimization.cjs
          node tests/ai-delta-isolation.cjs
          node tests/simulation-clock.cjs
          node tests/frame-diagnostics-parity.mjs
          node tests/frame-tick-parity.mjs
      - name: Check distance-based coastal terrain LOD
        run: |
          node --check src/terrain.js
          node tests/terrain-coast-lod.cjs
      - name: Check tower sentry rules and cooperative tower ramming
        run: |
          node tests/tower-sentries.mjs
          node tests/coop-barrier-ram.mjs
      - name: Check natural compound ground and building shadow receivers
        run: |
          node --check src/world-generation.js
          node --check src/buildings.js
          node --check src/compound-architecture.mjs
          node tests/compound-ground-surfaces.mjs
      - name: Check phase 4 static platform and dock batching parity
        run: |
          node --check src/static-decor-batching.js
          node --check src/world-generation.js
          node tests/static-decor-batch-parity.mjs
      - name: Reproduce tank crushing an occupied motorcycle death
        run: node tests/tank-motorcycle-death.cjs
      - name: Check hovercraft spatial distribution
        run: node tests/hover-distribution.mjs
      - name: Check modified JavaScript syntax
        run: |
          node --check src/enemy-ai.js
          node --check src/combat.js
          node --check src/compound-generation.js
          node --check src/tower-model.mjs
          node --check server/coop-combat.mjs
          node --check server/coop-mission.mjs
          node --check server/coop-vehicles.mjs
          node --check server/coop-optionals.mjs
      - name: Check nonexplosive flying vehicle fragments
        run: node tests/fragile-vehicle-fragments.mjs
      - name: Check release version in HTML and JS imports
        run: node tools/sync-version.cjs --check
      - name: Check separate touch horn and bicycle bell controls
        run: node tests/touch-vehicle-horn.mjs
      - name: Check phase 3 HQ intel parity and sector maps
        run: |
          node --check src/game-core.js
          node --check src/game-intel-core.mjs
          node tests/game-intel-parity.mjs
          node tests/sector-navigation-intel.cjs
      - name: Check phase 3 player input parity
        run: |
          node --check src/player-input-core.mjs
          node tests/player-input-parity.mjs
          node tests/vehicle-special.cjs
      - name: Check phase 3 world cleanup and fresh state
        run: |
          node --check src/start-lifecycle-core.mjs
          node --check src/game-state-core.mjs
          node tests/world-session-parity.mjs
      - name: Check phase 4 canonical HQ clue planning
        run: |
          node --check src/world-generation-core.mjs
          node --check src/world-generation.js
          node tests/hq-clue-plan-parity.mjs
          node tests/sector-navigation-intel.cjs
      - name: Check phase 4 compound site reservation parity
        run: |
          node --check src/compound-planning.mjs
          node --check src/world-generation.js
          node tests/compound-planning.mjs
          node tests/compound-reservation-parity.mjs
      - name: Check phase 4 port survey parity
        run: |
          node --check src/compound-planning.mjs
          node --check src/world-generation.js
          node tests/port-survey-parity.mjs
      - name: Check phase 4 coastal layout and ferry placement parity
        run: |
          node --check src/compound-coast-runtime.js
          node --check src/compound-planning.mjs
          node tests/coastal-layout-parity.mjs
      - name: Check phase 4 coast road A-star parity
        run: |
          node --check src/compound-coast-runtime.js
          node --check src/compound-planning.mjs
          node tests/coast-road-parity.mjs
      - name: Check phase 4 terrain pad planning parity
        run: |
          node --check src/game-core.js
          node --check src/world-physics.mjs
          node --check src/compound-planning.mjs
          node tests/terrain-pad-parity.mjs
          node tests/compound-planning.mjs
      - name: Check phase 4 compound path clearance and pier planning parity
        run: |
          node --check src/world-generation.js
          node --check src/compound-planning.mjs
          node tests/compound-path-pier-parity.mjs
          node tests/compound-paths.cjs
      - name: Check phase 4 standalone port and pier shoreline parity
        run: |
          node --check src/world-generation.js
          node --check src/compound-planning.mjs
          node tests/standalone-port-parity.mjs
      - name: Check base road corridor reservation against later compounds
        run: |
          node --check src/world-generation.js
          node --check src/compound-planning.mjs
          node tests/coast-road-reservation.mjs
      - name: Check phase 4 complete logical world generation matrix
        run: |
          node --check tests/world-generation-matrix.cjs
          node tests/world-generation-matrix.cjs
      - name: Generate runtime bundle
        run: node tools/build-runtime.cjs
      - name: Verify generated bundle
        run: node tools/build-runtime.cjs --check
      - name: Check generated JavaScript syntax
        run: node --check dist/hunter-runtime.*.js
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist src/runtime-bundle.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Hunter runtime bundle"
            git pull --rebase origin main
            # Fail closed if someone pushed new src during the build.
            # The following push event will rebuild from current sources.
            node tools/build-runtime.cjs --check
            git push origin HEAD:main
          fi
