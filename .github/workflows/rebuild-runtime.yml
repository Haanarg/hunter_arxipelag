name: Rebuild and verify Hunter runtime (push or manual)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/runtime-bundle.mjs' # no loop after committing the generated manifest
      - 'tools/build-runtime.cjs'
      - 'tools/sync-version.cjs'
      - 'tests/tower-sentries.mjs'
      - 'tests/hover-distribution.mjs'
      - 'tests/fragile-vehicle-fragments.mjs'
      - 'tests/touch-vehicle-horn.mjs'
      - '.github/workflows/rebuild-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-runtime-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tower sentry rules
        run: node tests/tower-sentries.mjs
      - name: Check hovercraft spatial distribution
        run: node tests/hover-distribution.mjs
      - name: Check modified JavaScript syntax
        run: |
          node --check src/enemy-ai.js
          node --check src/combat.js
          node --check src/compound-generation.js
          node --check src/tower-model.mjs
          node --check server/coop-combat.mjs
          node --check server/coop-optionals.mjs
      - name: Check nonexplosive flying vehicle fragments
        run: node tests/fragile-vehicle-fragments.mjs
      - name: Check release version in HTML and JS imports
        run: node tools/sync-version.cjs --check
      - name: Check separate touch horn and bicycle bell controls
        run: node tests/touch-vehicle-horn.mjs
      - name: Generate runtime bundle
        run: node tools/build-runtime.cjs
      - name: Verify generated bundle
        run: node tools/build-runtime.cjs --check
      - name: Check generated JavaScript syntax
        run: node --check dist/hunter-runtime.*.js
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist src/runtime-bundle.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Hunter runtime bundle"
            git pull --rebase origin main
            # Fail closed if someone pushed new src during the build.
            # The following push event will rebuild from current sources.
            node tools/build-runtime.cjs --check
            git push origin HEAD:main
          fi
