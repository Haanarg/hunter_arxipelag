name: Hunter - comprovacions bàsiques i runtime
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/runtime-bundle.mjs'
      - 'server/**'
      - 'tools/build-runtime.cjs'
      - 'tools/sync-version.cjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rebuild-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-runtime-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reparar textures BTR-82 dels LOD ja publicats (una sola vegada)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[btr82-materials-fix]') }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/repair-btr82-materials.cjs
          node tests/btr82-published-assets.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/vehicle-candidates/tanqueta
          if ! git diff --cached --quiet; then
            git commit -m "assets: replace broken UV atlases with matte BTR-82 LOD materials"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publicar GLB BTR-82 ja validats (una sola vegada)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[btr82-publish]') }}
        shell: bash
        run: |
          set -euo pipefail
          archive="assets/vehicle-candidates/tanqueta/.btr82-viewer-transfer.tar.xz"
          echo "a7315b97c92ee37e441a417fbb0b7a8dfea1f384067e4d45a07962dcf464e9ab  $archive" | sha256sum -c -
          expected="$(printf '%s\n' btr82-original-compatible.glb btr82-75pct.glb btr82-50pct.glb btr82-25pct.glb | sort)"
          actual="$(tar -tJf "$archive" | sort)"
          test "$actual" = "$expected"
          tar -xJf "$archive" -C assets/vehicle-candidates/tanqueta
          mv assets/vehicle-candidates/tanqueta/btr82-original-compatible.glb assets/vehicle-candidates/tanqueta/btr82-original.glb
          node tests/btr82-published-assets.cjs
          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/vehicle-candidates/tanqueta
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish original BTR-82 and 75/50/25 GLB candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Arxivar els models CC0 provisionals (única execució sol·licitada)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vehicles-download]') }}
        run: |
          node tools/fetch-vehicle-candidates.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/vehicle-candidates
          if ! git diff --cached --quiet; then
            git commit -m "assets: cache CC0 vehicle candidates for visual review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Instal·lar dependències
        run: npm ci --ignore-scripts
      - name: Executar proves bàsiques
        run: npm test
      - name: Comprovar versió
        run: node tools/sync-version.cjs --check
      - name: Generar i verificar el runtime
        run: |
          node tools/build-runtime.cjs
          node tools/build-runtime.cjs --check
          node --check dist/hunter-runtime.*.js
      - name: Publicar els fitxers generats si han canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist src/runtime-bundle.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Hunter runtime bundle"
            git pull --rebase origin main
            node tools/build-runtime.cjs --check
            git push origin HEAD:main
          fi
