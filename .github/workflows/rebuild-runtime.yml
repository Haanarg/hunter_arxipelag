name: Rebuild game runtime
on:
  push:
    paths:
      - '.github/workflows/rebuild-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild distribution
        run: node tools/build-runtime.cjs
      - name: Commit rebuilt runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/hunter-runtime.*.js src/runtime-bundle.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Build runtime with quick weapon selector"
            git push
          fi
