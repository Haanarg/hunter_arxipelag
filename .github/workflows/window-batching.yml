name: Façanes agrupades
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar façanes i destrucció
        run: node tests/window-batching.cjs
      - name: Verificar compounds
        run: node tests/compound-generation.cjs
