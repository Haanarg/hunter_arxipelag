name: Validació LOD palmeres
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar LOD, ombres, llavors i destrucció
        run: node tests/vegetation-lod.cjs
      - name: Verificar escalat de qualitat gràfica
        run: node tests/graphics-quality.cjs
      - name: Verificar control de rendiment
        run: node tests/performance.cjs
