name: Optimització LOD dels enemics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enemy-lod.yml'
      - 'src/enemy-lod.js'
      - 'src/runtime-scripts.mjs'
      - 'src/characters.js'
      - 'src/enemy-ai.js'
      - 'src/game-core.js'
      - 'src/combat.js'
      - 'src/world-generation.js'
      - 'src/ui.js'
      - 'tests/enemy-lod.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lod-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar models, LOD, mort i diagnòstic
        run: node tests/enemy-lod.cjs
      - name: Verificar IA enemiga
        run: node tests/enemy-navigation-world.cjs
      - name: Verificar rendiment i menú
        run: node tests/distance-performance-menu.cjs
