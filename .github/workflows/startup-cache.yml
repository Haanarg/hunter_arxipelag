name: Validar cache de l'arrencada
on:
  push:
    branches: [main]
    paths:
      - '_headers'
      - 'tests/startup-cache.cjs'
      - 'src/runtime-bundle.mjs'
      - 'src/bootstrap.mjs'
      - '.github/workflows/startup-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/startup-cache.cjs
