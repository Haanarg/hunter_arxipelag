name: Hunter V18 five independent weapon roots 0.6.308 (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  player-weapon-root-v18:
    if: github.head_ref == 'feature/v18-player-weapon-root-308'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Weapon mounts, native aim and COOP invariants
        run: node tests/human-game-runtime-v17.mjs
      - name: Syntax and version parity
        run: |
          node --check src/characters.js
          node tools/sync-version.cjs --check
          node tools/audit-model-scales.cjs
      - name: Full SOLO COOP gameplay and physics tests
        run: npm run test:all
      - name: Build and generated runtime check
        run: |
          npm run build
          npm run check:build
