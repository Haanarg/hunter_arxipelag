name: Hunter V18 native body-only v0.6.307 (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-body-v18:
    if: github.head_ref == 'feature/v18-native-body-only-307'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test native torso, pelvis, rifle, swim and COOP invariants
        run: node tests/human-game-runtime-v17.mjs
      - name: Version and scale audit
        run: |
          node --check src/characters.js
          node tools/sync-version.cjs --check
          node tools/audit-model-scales.cjs
      - name: Full gameplay, physics, SOLO and COOP tests
        run: npm run test:all
      - name: Rebuild and parity check
        run: |
          npm run build
          npm run check:build
