name: Postura de càrrega de granada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grenade-pose-tests.yml'
      - 'tests/grenade-charge-pose.cjs'
      - 'src/characters.js'
      - 'src/combat.js'
      - 'src/game-core.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar postures de càrrega i llançament
        run: node tests/grenade-charge-pose.cjs
