name: Arrencada ràpida i ports
on:
  push:
    branches: [main]
    paths:
      - 'src/world-generation.js'
      - 'src/compound-generation.js'
      - 'tests/port-startup.cjs'
      - '.github/workflows/port-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  port-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Perfilat ràpid de llavor 67
        run: node tests/port-startup.cjs
