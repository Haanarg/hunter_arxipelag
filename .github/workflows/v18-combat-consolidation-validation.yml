name: Hunter V18 final enemy combat consolidation validation
on:
  push:
    branches:
      - v18-consolidate-combat-0-6-300
permissions:
  contents: read
concurrency:
  group: hunter-v18-combat-consolidation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node tests/enemy-native-v18.mjs
      - run: node tests/enemy-crew-native-v18.mjs
      - run: npm run test:lab
      - run: npm run test:all
      - run: npm run test:deploy
      - run: npm run build && npm run check:build
      - run: node tests/runtime-bundle-parity.cjs
      - run: node tests/browser-startup-smoke.cjs
