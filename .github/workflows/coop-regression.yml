name: Cooperatiu - regressions de xarxa i interpolacio
on:
  workflow_dispatch:
    # Execució manual quan torni a haver-hi quota de GitHub Actions.

permissions:
  contents: read

concurrency:
  group: coop-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coop-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instal·lar dependències
        run: npm ci --ignore-scripts
      - name: Sintaxi dels mòduls modificats
        run: |
          node --check src/native-coop-interpolation.mjs
          node --check src/native-coop-prediction.mjs
          node --check src/ferry-deck-core.mjs
          node --check server/coop-vehicles.mjs
          node --check server/coop-mission.mjs
          node --check src/coop-world-runtime.js
          node --check src/native-coop-connection.mjs
          node --check tests/native-coop-interpolation.mjs
      - name: Regressions de xarxa del COOP
        run: |
          node tests/native-coop-interpolation.mjs
          node tests/native-coop-local-presentation.mjs
          node tests/native-coop-projectile-visual.mjs
          node tests/coop-cheats.mjs
          node tests/coop-host-start.mjs
          node tests/player-simulation.mjs
          node tests/native-coop-subtick.mjs
          node tests/native-coop-enemy-interpolation.mjs
          node tests/native-coop-prediction-cache.mjs
          node tests/native-coop-phase4.mjs
          node tests/native-coop-vehicle-candidates.mjs
          node tests/native-coop-wall-candidates.mjs
          node tests/native-coop-network-jitter.mjs
          node tests/native-coop-delta-transport.mjs
          node tests/coop-state-delta.mjs
          node tests/coop-broadcast-encoding.mjs
          node tests/coop-transport-telemetry.mjs
      - name: Integracio amb motor original (càmera, passatger i pilot)
        run: |
          node tests/native-coop-interpolation-runtime.cjs
          node tests/native-coop-enemy-runtime.cjs
      - name: Flota compartida i passatgers de l’hovercraft
        run: |
          node tests/hovercraft-prototypes.mjs
          node tests/hovercraft-game-integration.mjs
          node tests/native-coop-side-by-side-riders.cjs
          node tests/native-coop-fleet-parity.cjs
          node tests/shared-vehicle-models.mjs
      - name: Requisició de vehicles enemics, pilot/copilot i persecució
        run: |
          node --check server/enemy-vehicle-controller.mjs
          node --check src/enemy-vehicle-requisition.mjs
          node --check server/coop-combat.mjs
          node tests/enemy-vehicle-requisition.mjs
      - name: Comprovar paquet del runtime
        run: node tools/build-runtime.cjs --check
