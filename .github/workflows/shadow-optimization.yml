name: Ombres i malles agrupades
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shadow-optimization.yml'
      - 'src/buildings.js'
      - 'src/game-core.js'
      - 'src/world-generation.js'
      - 'src/visual-config.js'
      - 'src/ui.js'
      - 'index.html'
      - 'tests/shadow-optimization.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar ombres i sostres agrupats
        run: node tests/shadow-optimization.cjs
      - name: Validar edificis i compounds
        run: node tests/compound-generation.cjs
      - name: Validar perfils gràfics
        run: node tests/graphics-quality.cjs
