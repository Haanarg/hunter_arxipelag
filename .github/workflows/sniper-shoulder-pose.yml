name: Rifle de franctirador recolzat a l'espatlla
on:
  push:
    branches: [main]
    paths:
      - 'src/characters.js'
      - 'src/combat.js'
      - 'tests/sniper-shoulder-pose.cjs'
      - 'tests/sniper-muzzle.cjs'
      - '.github/workflows/sniper-shoulder-pose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rifle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar culata, canells i braços del franctirador
        run: node tests/sniper-shoulder-pose.cjs
      - name: Confirmar boca de foc i convergència de l'òptica
        run: node tests/sniper-muzzle.cjs
      - name: Verificar model general del jugador
        run: node tests/player-model.cjs
