name: Filferrades i cisalla silenciosa
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bolt-cutters.yml'
      - 'src/bolt-cutters.js'
      - 'src/runtime-scripts.mjs'
      - 'src/combat.js'
      - 'src/enemy-ai.js'
      - 'src/characters.js'
      - 'src/compound-generation.js'
      - 'src/compound-layouts.mjs'
      - 'src/game-core.js'
      - 'src/world-generation.js'
      - 'src/ui.js'
      - 'tests/bolt-cutters.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar bales, filferrades, tall silenciós i tallers
        run: node tests/bolt-cutters.cjs
      - name: Regressió del paracaigudes
        run: node tests/parachute-pose.cjs
      - name: Regressió de compounds
        run: node tests/compound-generation.cjs
      - name: Regressió de filferrades i malles
        run: node tests/fence-batching.cjs
      - name: Regressió de trajectòria i impactes
        run: node tests/bullet-impact-fx.cjs
