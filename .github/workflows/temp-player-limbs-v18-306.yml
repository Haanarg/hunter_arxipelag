name: Hunter V18 no legacy limbs v0.6.306 (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  player-limbs-v18:
    if: github.head_ref == 'feature/v18-no-legacy-limb-306'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate V18-only actor motion and action poses
        run: node tests/human-game-runtime-v17.mjs
      - name: Check source and version
        run: |
          node --check src/characters.js
          node tools/sync-version.cjs --check
          node tools/audit-model-scales.cjs
      - name: Run full SOLO COOP animation and physics regressions
        run: npm run test:all
      - name: Build and confirm runtime bundle
        run: |
          npm run build
          npm run check:build
