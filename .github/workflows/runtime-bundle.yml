name: Generar i verificar el runtime agrupat
on:
  # Mai automàticament després d'un push: el paquet es genera localment.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-runtime-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Agrupar fitxers en ordre
        run: node tools/build-runtime.cjs
      - name: Comprovar el hash i la integritat
        run: node tools/build-runtime.cjs --check
      - name: Comprovar la sintaxi del paquet generat
        run: node --check dist/hunter-runtime.*.js
      - name: Publicar el runtime si la compilació i la sintaxi són correctes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-bundle.mjs dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: actualitzar runtime agrupat i hash"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
