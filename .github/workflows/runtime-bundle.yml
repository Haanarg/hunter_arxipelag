name: Generar i verificar el runtime agrupat
on:
  # Mai automàticament després d'un push: el paquet es genera localment.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-runtime-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Agrupar fitxers en ordre
        run: node tools/build-runtime.cjs
      - name: Comprovar el hash i la integritat
        run: node tools/build-runtime.cjs --check
      - name: Comprovar la sintaxi del paquet generat
        run: node --check dist/hunter-runtime.*.js
      - name: Comprovar els pivots i els controls del moviment
        shell: bash
        run: |
          # Recorrem totes les proves independents i informam de tots els
          # errors en un únic workflow manual, sense ocultar-ne cap.
          failed=0
          for test in \
            shared-resources \
            optimization-ui-render-hooks \
            joystick-running \
            player-locomotion \
            rowing-audio-camera \
            vehicle-weapon-reticle \
            water-jumps \
            locomotion-blast \
            enemy-weapon-damage \
            shark-behaviour \
            performance-stats-toggle \
            loot-health \
            two-storey-destruction \
            pier-access \
            truck-exit \
            heavy-vehicle-collisions \
            fence-collision \
            village-well \
            enemy-vehicle-trails \
            heli-grenade-crawl \
            civilian-house-loot \
            sector-navigation-intel \
            minimap-click; do
            echo "::group::tests/${test}.cjs"
            node "tests/${test}.cjs" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"
      - name: Publicar només si han passat les proves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-bundle.mjs dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: actualitzar runtime agrupat i hash"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
