name: Generar i verificar el runtime agrupat
on:
  # Únic workflow de push: només quan cal regenerar el paquet clàssic.
  push:
    branches: [main]
    paths:
      - 'src/*.js'
      - 'src/runtime-scripts.mjs'
      - 'tools/build-runtime.cjs'
      - 'tests/joystick-running.cjs'
      - 'tests/player-locomotion.cjs'
      - 'tests/rowing-audio-camera.cjs'
      - 'tests/vehicle-weapon-reticle.cjs'
      - 'tests/water-jumps.cjs'
      - 'tests/locomotion-blast.cjs'
      - 'tests/enemy-weapon-damage.cjs'
      - 'tests/shark-behaviour.cjs'
      - 'tests/performance-stats-toggle.cjs'
      - 'tests/loot-health.cjs'
      - 'tests/two-storey-destruction.cjs'
      - 'tests/pier-access.cjs'
      - 'tests/truck-exit.cjs'
      - 'tests/heavy-vehicle-collisions.cjs'
      - 'tests/fence-collision.cjs'
      - 'tests/village-well.cjs'
      - 'tests/enemy-vehicle-trails.cjs'
      - 'index.html'
      - 'src/ui.js'
      - '.github/workflows/runtime-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-runtime-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agrupar fitxers en ordre
        run: node tools/build-runtime.cjs
      - name: Comprovar el hash i la integritat
        run: node tools/build-runtime.cjs --check
      - name: Comprovar la sintaxi del paquet generat
        run: node --check dist/hunter-runtime.*.js
      - name: Comprovar els pivots i els controls del moviment
        run: |
          node tests/joystick-running.cjs
          node tests/player-locomotion.cjs
          node tests/rowing-audio-camera.cjs
          node tests/vehicle-weapon-reticle.cjs
          node tests/water-jumps.cjs
          node tests/locomotion-blast.cjs
          node tests/enemy-weapon-damage.cjs
          node tests/shark-behaviour.cjs
          node tests/performance-stats-toggle.cjs
          node tests/loot-health.cjs
          node tests/two-storey-destruction.cjs
          node tests/pier-access.cjs
          node tests/truck-exit.cjs
          node tests/heavy-vehicle-collisions.cjs
          node tests/fence-collision.cjs
          node tests/village-well.cjs
          node tests/enemy-vehicle-trails.cjs
      - name: Publicar només si han passat les proves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-bundle.mjs dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: actualitzar runtime agrupat i hash"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
