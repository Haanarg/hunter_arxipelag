name: Optimització del terreny
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terrain-optimization.yml'
      - 'src/terrain.js'
      - 'src/world-generation.js'
      - 'src/game-core.js'
      - 'src/performance.js'
      - 'tests/terrain-stream.cjs'
      - 'tests/performance.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar geometria, LOD, contacte i ombres
        run: node tests/terrain-stream.cjs
      - name: Validar mètriques de rendiment
        run: node tests/performance.cjs
      - name: Validar perfils gràfics
        run: node tests/graphics-quality.cjs
