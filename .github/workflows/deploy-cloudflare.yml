name: Hunter - desplegament Cloudflare
# Desplegament real del Worker i dels assets del joc a Paradoxa.
# Push de versió del joc/laboratori, canvi en aquest workflow o execució manual.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/version.mjs'
      - 'assets/vehicle-candidates/lab-revision.json'
      - 'src/hovercraft-concepts.mjs'
      - 'src/human-proposals.mjs'
      - 'src/human-game-runtime-v17.mjs'
      - 'src/account-menu.js'
      - 'src/rider.js'
      - 'tests/account-submenus.mjs'
      - 'src/player-model-core.mjs'
      - 'src/bootstrap.mjs'
      - 'src/menu-boot.mjs'
      - 'index.html'
      - 'proves.html'
      - 'src/vehicles-externs-proves.mjs'
      - 'tests/human-game-runtime-v17.mjs'
      - 'src/human-weapon-preview.mjs'
      - 'src/human-current-models.mjs'
      - 'src/human-model-catalog.mjs'
      - 'tests/human-proposals.mjs'
      - 'tests/vehicle-candidate-studio.cjs'
      - '.github/workflows/deploy-cloudflare.yml'
permissions:
  contents: read
concurrency:
  group: hunter-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar credencials de desplegament sense mostrar secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID"; missing=1; fi
          if [ -z "$CF_TOKEN" ]; then echo "::error::Falta el secret CLOUDFLARE_API_TOKEN"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Instal·lar dependències
        run: npm ci --ignore-scripts
      - name: Comprovar contracte publicable del laboratori
        run: npm run test:deploy
      - name: Validar models humans i editor en temps real
        run: npm run test:lab
      - name: Validar recollida del fusell d'assalt i munició (individual i cooperatiu)
        run: node tests/assault-repeat-pickup.mjs
      - name: Validar navegació del compte i submenús
        run: node tests/account-submenus.mjs
      - name: Validar HUMANS V17 al joc i als conductors
        run: node tests/human-game-runtime-v17.mjs
      - name: Regenerar el runtime a partir dels fitxers font validats
        run: |
          npm run build
          npm run check:build
      - name: Comprovar la compilació del Worker
        run: npm run build:worker
      - name: Desplegar Worker i assets a Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ "${#AUTH_SECRET}" -ge 32 ]; then
            # Primer desplegament o rotació explícita del secret.
            npm run deploy:cloudflare
          else
            # En desplegaments successius Wrangler CONSERVA els secrets
            # existents; exigim que AUTH_SECRET ja sigui al Worker.
            npx --yes wrangler@4.154.0 secret list --format json > "$RUNNER_TEMP/hunter-secrets.json"
            node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(a)||!a.some(s=>s.name==="AUTH_SECRET")){console.error("::error::AUTH_SECRET no existeix al Worker. Configura’l a Cloudflare abans del deploy.");process.exit(1)}' "$RUNNER_TEMP/hunter-secrets.json"
            npx --yes wrangler@4.154.0 deploy --keep-vars
          fi
      - name: Verificar versió real a Paradoxa
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*GAME_VERSION = '\([^']*\)'.*/\1/p" src/version.mjs)"
          if [ -z "$version" ]; then echo "::error::No s'ha pogut llegir la versió"; exit 1; fi
          # Compare the final HTTP body, not Cloudflare's canonical HTML redirect.
          files=(index.html src/bootstrap.mjs src/menu-boot.mjs src/player-model-core.mjs src/human-game-runtime-v17.mjs src/version.mjs src/human-weapon-preview.mjs src/compound-preview.mjs src/compound-concepts.mjs compounds-preview.html src/hovercraft-concepts.mjs src/vehicle-model-core.mjs src/vehicle-specs.mjs src/ka60-runtime.mjs assets/vehicle-candidates/lab-revision.json src/human-model-catalog.mjs src/human-current-models.mjs src/human-proposals.mjs src/human-lab-evidence.mjs src/human-lab-evidence-ui.mjs src/vehicle-live-editor.mjs src/vehicles-externs-proves.mjs src/proves-hub.mjs proves.html vehicles-externs-proves.html)
          for delay in 0 3 6 12 24 30; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            failed=0
            for path in "${files[@]}"; do
              url="https://hunter.paradoxa.cat/$path?release=$COMMIT&retry=$delay"
              if ! result="$(curl --fail --silent --show-error --location --max-redirs 5 --proto-redir '=https' --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/hunter-published-check" \
                --write-out '%{http_code} %{url_effective} redirects=%{num_redirects}')"; then
                echo "No s'ha pogut llegir: $path ($result)"
                failed=1
              elif ! cmp -s "$path" "$RUNNER_TEMP/hunter-published-check"; then
                echo "Contingut diferent del commit: $path ($result)"
                echo "SHA256 esperat: $(sha256sum "$path" | cut -d' ' -f1)"
                echo "SHA256 rebut: $(sha256sum "$RUNNER_TEMP/hunter-published-check" | cut -d' ' -f1)"
                failed=1
              else
                echo "Verificat: $path ($result)"
              fi
            done
            if [ "$failed" -eq 0 ]; then
              echo "Paradoxa: versió $version i assets exactes del commit $COMMIT verificats"
              exit 0
            fi
          done
          echo "::error::Cloudflare ha desplegat, però no s'han verificat tots els assets a Paradoxa."
          exit 1
