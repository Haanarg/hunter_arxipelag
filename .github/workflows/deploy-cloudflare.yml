name: Hunter - desplegament Cloudflare
# Desplegament real del Worker i dels assets del joc a Paradoxa.
# Només un push de versió, un canvi en aquest workflow o una execució manual.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/version.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
permissions:
  contents: read
concurrency:
  group: hunter-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar credencials de desplegament sense mostrar secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          missing=0
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID"; missing=1; fi
          if [ -z "$CF_TOKEN" ]; then echo "::error::Falta el secret CLOUDFLARE_API_TOKEN"; missing=1; fi
          if [ "${#AUTH_SECRET}" -lt 32 ]; then echo "::error::Falta AUTH_SECRET o no arriba als 32 caràcters"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Instal·lar dependències
        run: npm ci --ignore-scripts
      - name: Comprovar versió i bundle publicable
        run: npm run check:build
      - name: Comprovar la compilació del Worker
        run: npm run build:worker
      - name: Desplegar Worker i assets a Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: npm run deploy:cloudflare
      - name: Verificar versió real a Paradoxa
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*GAME_VERSION = '\([^']*\)'.*/\1/p" src/version.mjs)"
          if [ -z "$version" ]; then echo "::error::No s'ha pogut llegir la versió"; exit 1; fi
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://hunter.paradoxa.cat/src/version.mjs?release=$COMMIT" | grep -Fq "GAME_VERSION = '$version'"; then
              echo "Paradoxa: versió $version desplegada i verificada"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Cloudflare ha desplegat, però Paradoxa encara no serveix la versió $version."
          exit 1
