name: Hunter - desplegament Cloudflare
# Desplegament real del Worker i dels assets del joc a Paradoxa.
# Push de versió del joc/laboratori, canvi en aquest workflow o execució manual.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/version.mjs'
      - 'assets/vehicle-candidates/lab-revision.json'
      - '.github/workflows/deploy-cloudflare.yml'
permissions:
  contents: read
concurrency:
  group: hunter-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar sintaxi del laboratori de vehicles abans de desplegar
        run: |
          node --check src/civilian-car-model.mjs
          node --check src/vehicle-candidate-catalog.mjs
          node --check src/vehicles-externs-proves.mjs
          node --check src/vehicle-live-editor.mjs
          node --check src/btr82-3b-preview.mjs
          node --check src/vehicle-reference-candidates.mjs
          node --check tests/gaz-tigr-door-contours.mjs
      - name: Verificar credencials de desplegament sense mostrar secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID"; missing=1; fi
          if [ -z "$CF_TOKEN" ]; then echo "::error::Falta el secret CLOUDFLARE_API_TOKEN"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Instal·lar dependències
        run: npm ci --ignore-scripts
      - name: Comprovar C1A definitiu, inventari GLB i pestanyes de l'editor
        run: |
          node tests/civilian-car-roof-candidate.mjs
          node tests/vehicle-lab-current-models.mjs
          node tests/gaz-tigr-door-contours.mjs
          node tests/gaz-tigr-approved.mjs
          node tests/btr82-published-assets.cjs
          node tests/vehicle-candidate-studio.cjs
          node tests/huey-native-runtime.mjs
          node tests/apache-native-runtime.mjs
      - name: Comprovar versió i bundle publicable
        run: npm run check:build
      - name: Comprovar la compilació del Worker
        run: npm run build:worker
      - name: Desplegar Worker i assets a Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ "${#AUTH_SECRET}" -ge 32 ]; then
            # Primer desplegament o rotació explícita del secret.
            npm run deploy:cloudflare
          else
            # En desplegaments successius Wrangler CONSERVA els secrets
            # existents; exigim que AUTH_SECRET ja sigui al Worker.
            npx --yes wrangler@4.154.0 secret list --format json > "$RUNNER_TEMP/hunter-secrets.json"
            node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(a)||!a.some(s=>s.name==="AUTH_SECRET")){console.error("::error::AUTH_SECRET no existeix al Worker. Configura’l a Cloudflare abans del deploy.");process.exit(1)}' "$RUNNER_TEMP/hunter-secrets.json"
            npx --yes wrangler@4.154.0 deploy --keep-vars
          fi
      - name: Verificar versió real a Paradoxa
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*GAME_VERSION = '\([^']*\)'.*/\1/p" src/version.mjs)"
          if [ -z "$version" ]; then echo "::error::No s'ha pogut llegir la versió"; exit 1; fi
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://hunter.paradoxa.cat/src/version.mjs?release=$COMMIT" | grep -Fq "GAME_VERSION = '$version'"; then
              echo "Paradoxa: versió $version desplegada i verificada"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Cloudflare ha desplegat, però Paradoxa encara no serveix la versió $version."
          exit 1
