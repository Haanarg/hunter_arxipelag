name: Boca i trajectòria del rifle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar origen i convergència del tret
        run: node tests/sniper-muzzle.cjs
      - name: Regressió de mira LOD
        run: node tests/sniper-lod.cjs
      - name: Regressió de trajectòria granada
        run: node tests/grenade-charge-pose.cjs
