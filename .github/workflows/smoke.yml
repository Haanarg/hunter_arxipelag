name: Regressió general del joc
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/smoke.cjs'
      - 'tests/harness.cjs'
      - 'index.html'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
