# Bateria curta de regressions; només s'executa per petició manual.
# Les proves descartades no formen part del repositori.
name: Proves essencials (manual)
on:
  workflow_dispatch:
    inputs:
      grup:
        description: "Quin grup de regressions vols executar?"
        type: choice
        required: true
        default: world
        options:
          - world
          - combat
          - ending
          - startup
          - all
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Executar proves seleccionades (sense duplicats)
        env:
          GRUP: ${{ inputs.grup }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GRUP" in
            world)
              set -- terrain-level-index terrain-stream water water-jumps rock-fields shark-behaviour seed-replay compound-generation loot-health two-storey-destruction pier-access ferry-land-patrols
              ;;
            combat)
              set -- enemy-navigation projectile-classes enemy-vehicle-trails vehicle-weapon-reticle water-jumps locomotion-blast enemy-weapon-damage damage-consistency heavy-vehicle-collisions
              ;;
            ending)
              set -- victory-cinematic death-cinematic
              ;;
            startup)
              set -- shared-resources smoke startup-cache optimization-ui-render-hooks joystick-running player-locomotion rowing-audio-camera performance-stats-toggle player-death-zero pause-menu integer-damage loot-health locomotion-blast truck-preview truck-game-model truck-debris ferry-land-patrols pier-access
              ;;
            all)
              set -- shared-resources smoke startup-cache optimization-ui-render-hooks joystick-running player-locomotion rowing-audio-camera performance-stats-toggle player-death-zero pause-menu integer-damage loot-health vehicle-weapon-reticle rock-fields nature-prototypes truck-preview truck-game-model truck-debris ferry-land-patrols water-jumps shark-behaviour locomotion-blast enemy-weapon-damage pier-access terrain-level-index terrain-stream water seed-replay compound-generation two-storey-destruction enemy-navigation projectile-classes enemy-vehicle-trails damage-consistency heavy-vehicle-collisions victory-cinematic death-cinematic
              ;;
            *)
              echo "Grup de proves desconegut: $GRUP" >&2
              exit 2
              ;;
          esac
          for test in "$@"; do
            echo "::group::tests/${test}.cjs"
            node "tests/${test}.cjs"
            echo "::endgroup::"
          done
