# Bateria curta de regressions; només s'executa per petició manual.
# Les proves descartades no formen part del repositori.
name: Proves essencials (manual)
on:
  workflow_dispatch:
    inputs:
      grup:
        description: "Quin grup de regressions vols executar?"
        type: choice
        required: true
        default: world
        options:
          - world
          - mission
          - camera
          - timing
          - combat
          - feedback
          - stealth
          - loading
          - audio
          - exploration
          - camp
          - ending
          - startup
          - all
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Executar proves seleccionades (sense duplicats)
        env:
          GRUP: ${{ inputs.grup }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GRUP" in
            timing)
              set -- simulation-clock simulation-timing camera-controls
              ;;
            camera)
              set -- camera-controls bunker-basement
              ;;
            mission)
              set -- mission-viability-validator mission-viability bunker-basement
              ;;
            world)
              set -- terrain-level-index terrain-stream water water-jumps rock-fields shark-behaviour seed-replay compound-generation loot-health two-storey-destruction pier-access ferry-land-patrols
              ;;
            camp)
              set -- camp-redesign-independent prison-camp-guarantee prison-camp-guarantee-independent phase11-camp-generation simulation-clock startup-cache
              ;;
            exploration)
              set -- phase11-prisoners phase11-radio phase11-independent phase11-camp-generation simulation-clock startup-cache
              ;;
            audio)
              set -- spatial-audio phase12-independent simulation-clock
              ;;
            loading)
              set -- progressive-generation phase10-independent simulation-clock startup-cache
              ;;
            stealth)
              set -- stealth-perception stealth-feedback stealth-coordination phase8-independent enemy-navigation
              ;;
            feedback)
              set -- combat-feedback phase6-independent integer-damage enemy-weapon-damage
              ;;
            combat)
              set -- enemy-accuracy heavy-targeting explosive-fence enemy-navigation projectile-classes enemy-vehicle-trails vehicle-weapon-reticle water-jumps locomotion-blast enemy-weapon-damage damage-consistency heavy-vehicle-collisions
              ;;
            ending)
              set -- victory-cinematic death-cinematic
              ;;
            startup)
              set -- simulation-clock simulation-timing performance-audit shadow-cache shadow-fauna-cache shadow-boat-cache stress-audit-config vehicle-batching player-batching compound-paths shared-resources camera-controls smoke startup-cache optimization-ui-render-hooks joystick-running player-locomotion rowing-audio-camera performance-stats-toggle player-death-zero pause-menu integer-damage loot-health locomotion-blast truck-preview truck-game-model truck-debris ferry-land-patrols pier-access
              ;;
            all)
              set -- camp-redesign-independent prison-camp-guarantee prison-camp-guarantee-independent phase11-prisoners phase11-radio phase11-independent phase11-camp-generation spatial-audio phase12-independent progressive-generation phase10-independent stealth-perception stealth-feedback stealth-coordination phase8-independent combat-feedback phase6-independent simulation-clock simulation-timing performance-audit shadow-cache shadow-fauna-cache shadow-boat-cache stress-audit-config vehicle-batching player-batching compound-paths shared-resources camera-controls smoke startup-cache optimization-ui-render-hooks joystick-running player-locomotion rowing-audio-camera performance-stats-toggle player-death-zero pause-menu integer-damage loot-health vehicle-weapon-reticle rock-fields nature-prototypes truck-preview truck-game-model truck-debris ferry-land-patrols water-jumps shark-behaviour locomotion-blast enemy-weapon-damage enemy-accuracy heavy-targeting explosive-fence pier-access terrain-level-index terrain-stream water seed-replay compound-generation mission-viability-validator mission-viability bunker-basement two-storey-destruction enemy-navigation projectile-classes enemy-vehicle-trails damage-consistency heavy-vehicle-collisions victory-cinematic death-cinematic
              ;;
            *)
              echo "Grup de proves desconegut: $GRUP" >&2
              exit 2
              ;;
          esac
          for test in "$@"; do
            echo "::group::tests/${test}.cjs"
            node "tests/${test}.cjs"
            echo "::endgroup::"
          done
