name: Reproducció de llavors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-replay.yml'
      - 'src/game-core.js'
      - 'src/world-generation.js'
      - 'src/seed-search.js'
      - 'tests/seed-replay.cjs'
      - 'tests/seed-search.cjs'
      - 'tests/seed-search-integration.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reintroduir la llavor del HUD i reproduir el mapa
        run: node tests/seed-replay.cjs
      - name: Cercador de llavors i aplicació del resultat
        run: node tests/seed-search-integration.cjs
      - name: Catàleg del cercador
        run: node tests/seed-search.cjs
