name: Col·lisions amb antenes i parabòliques
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/helicopter-air-obstacles.yml'
      - 'src/air-obstacles.js'
      - 'src/runtime-scripts.mjs'
      - 'src/compound-generation.js'
      - 'src/world-generation.js'
      - 'src/game-core.js'
      - 'tests/helicopter-air-obstacles.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collisions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar antena, parabolica i destruccio dels dos helicòpters
        run: node tests/helicopter-air-obstacles.cjs
      - name: Comprovar col·lisions amb cobertes
        run: node tests/helicopter-roof.cjs
      - name: Comprovar aterratges
        run: node tests/helicopter-landing.cjs
      - name: Comprovar velocitat
        run: node tests/helicopter-handling.cjs
