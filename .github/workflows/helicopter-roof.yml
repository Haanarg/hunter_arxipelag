name: Col·lisió helicòpters i cobertes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provar col·lisions de sostres plans i corbats
        run: node tests/helicopter-roof.cjs
      - name: Regressió de patins i ferris
        run: node tests/helicopter-landing.cjs
      - name: Regressió de complexos
        run: node tests/compound-generation.cjs
