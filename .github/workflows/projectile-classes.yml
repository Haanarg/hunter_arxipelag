name: Munició lleugera i pesada
on:
  push:
    branches: [main]
    paths:
      - 'src/combat.js'
      - 'src/compound-generation.js'
      - 'tests/projectile-classes.cjs'
      - '.github/workflows/projectile-classes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projectiles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classificar projectils i protegir blindats
        run: node tests/projectile-classes.cjs
      - name: Validar els efectes dels impactes
        run: node tests/bullet-impact-fx.cjs
      - name: Verificar les construccions militars
        run: node tests/compound-generation.cjs
