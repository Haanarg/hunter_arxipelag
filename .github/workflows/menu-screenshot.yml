name: Captura de portada (llavor 67)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/menu-screenshot.yml'
      - 'tools/capture-menu.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturar llavor 67
        run: node tools/capture-menu.cjs
      - name: Publicar imatge estàtica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/menu-seed-67.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Portada estàtica: captura Three.js de la llavor 67"
            git push
          fi
