name: Ojives pesades orientades
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warheads:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar puntes i orientació dels projectils pesats
        run: node tests/heavy-warhead-geometry.cjs
      - name: Validar categories balístiques i danys
        run: node tests/projectile-classes.cjs
      - name: Verificar models i tipus d'armes reals
        run: node tests/weapon-classification.cjs
      - name: Validar impactes i efectes
        run: node tests/bullet-impact-fx.cjs
