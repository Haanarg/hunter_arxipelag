name: Decoració estàtica agrupada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-decor-batching.yml'
      - 'src/world-generation.js'
      - 'tests/static-decor-batching.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar batches de camins, molls i decoració
        run: node tests/static-decor-batching.cjs
      - name: Verificar generació de compounds
        run: node tests/compound-generation.cjs
