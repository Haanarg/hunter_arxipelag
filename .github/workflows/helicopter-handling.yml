name: Velocitat i agilitat dels helicòpters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar velocitat i maniobrabilitat
        run: node tests/helicopter-handling.cjs
      - name: Comprovar aterratges
        run: node tests/helicopter-landing.cjs
      - name: Comprovar sostres i collisions
        run: node tests/helicopter-roof.cjs
