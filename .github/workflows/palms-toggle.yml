name: Interruptor sense palmeres
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar interruptor, col·lisions i llavor
        run: node tests/palms-toggle.cjs
      - name: Verificar simplificació de palmeres
        run: node tests/vegetation-lod.cjs
