<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#112b32">
<title>Hunter: Arxipèlag · prova de portada 3D</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/hunter-icon-32.png">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112e45;color:#fff}
#vista{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(125deg,#0c2339,#22627a 58%,#d88d6d);pointer-events:none}
#vista::before{content:"";position:absolute;inset:0;background:url('assets/menu-seed-67.jpg') center/cover no-repeat;opacity:1}
#vista canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1s ease}
#vista.ready canvas{opacity:1}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(5,18,30,.30) 0%,rgba(5,18,30,.09) 29%,rgba(5,18,30,.16) 45%,rgba(5,18,30,.50) 71%,rgba(5,14,18,.80) 100%)}
#app{z-index:2;position:relative;display:flex;flex-direction:column;align-items:center;width:100%;height:100dvh;min-height:0;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));text-align:center;gap:0}
.topbar{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1000px;width:100%;margin:0 auto;flex:none}
.preview-tag{font:700 10px/1.2 system-ui;letter-spacing:.13em;color:#fff4d2;background:#0d2535b9;border:1px solid #efce8166;border-radius:99px;padding:6px 9px}
.top-tools{display:flex;gap:8px;align-items:center}
.top-tools button,.top-tools a{font:700 11px system-ui;letter-spacing:.02em;color:white;background:#10252fbd;border:1px solid #ddc89877;border-radius:6px;padding:8px 11px;text-decoration:none;cursor:pointer}
.top-tools button[aria-pressed="true"]{color:#2b2510;background:#e7b45e;border-color:#ffe5a5}
#brand{margin:clamp(6px,2vh,26px) 0 0;width:min(760px,86vw);max-height:clamp(98px,29dvh,250px);min-height:0;display:flex;justify-content:center;align-items:center;flex:none}
#brand img{display:block;width:100%;max-height:inherit;object-fit:contain;filter:drop-shadow(0 4px 8px #000a)}
#tagline{margin:clamp(4px,.5vh,8px) 0 0;font-size:clamp(12px,2.5vw,20px);letter-spacing:.17em;font-weight:900;color:#fff2d3;text-shadow:0 2px 8px #000}
#intro{margin:8px auto 0;max-width:550px;font-size:clamp(11px,2.25vw,16px);line-height:1.35;color:#fff2dc;text-shadow:0 2px 6px #000,0 0 15px #000c}
#intro span{display:block}
.grow{flex:1;min-height:12px}
.menu{width:min(740px,100%);display:grid;gap:9px;flex:none;margin:0 0 clamp(10px,2.5vh,26px)}
.button{font-family:inherit;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;min-height:51px;padding:9px 15px;cursor:pointer;border-radius:8px;border:2px solid #ae935d;font-weight:900;letter-spacing:.035em;text-decoration:none;box-shadow:0 4px 0 #11100bd9,0 10px 20px #0008,inset 0 1px #ffe8b18a;text-shadow:0 1px 2px #000b;transition:filter .14s ease,transform .14s ease}
.button:hover,.button:focus-visible{filter:brightness(1.15);outline:2px solid #fff1be;outline-offset:3px}
.button:active{transform:translateY(2px);box-shadow:0 1px 0 #090d0d}
.button b{font-size:1.5em;font-weight:700;line-height:1}
.button.primary{color:#241a08;font-size:clamp(20px,4.5vw,32px);min-height:clamp(60px,10vh,86px);border:3px ridge #ffe5a0;background:linear-gradient(165deg,#fff5b4 0%,#dfb66e 18%,#a77229 45%,#edc378 75%,#8b561d 100%);text-shadow:0 1px #ffe7ac7d;box-shadow:inset 0 0 0 2px #593b1f,0 5px 0 #533819,0 12px 20px #0009}
.button.dark{color:#f8dea0;font-size:clamp(13px,2.6vw,18px);background:linear-gradient(150deg,#3e4137,#1a211e 46%,#2a2923 75%,#101619);border-color:#b6a072}
.button.small{min-height:38px;box-shadow:0 2px 0 #11100bdd;background:linear-gradient(#353b36,#101d22);color:#ead5a5;border-color:#867451;font-size:clamp(10px,1.9vw,13px);letter-spacing:.01em}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mini-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#setup[hidden],#home[hidden]{display:none!important}
#setup{background:linear-gradient(160deg,#102d2ff5,#101d21ee);border:1px solid #d6b777b8;border-radius:10px;padding:12px;box-shadow:0 10px 40px #000b;max-height:min(68dvh,490px);overflow-y:auto;scrollbar-width:thin}
#setup h2{font-size:clamp(16px,3vw,23px);color:#f6d696;margin:0 0 8px;letter-spacing:.06em}
#setup .row{display:grid;grid-template-columns:1fr 1.2fr;gap:9px;align-items:center;margin:7px 0;text-align:left}
#setup label{font-size:clamp(12px,2vw,16px);color:#eddcb9;font-weight:700}
#setup input,#setup select{width:100%;min-width:0;padding:9px 8px;color:white;background:#0a1c21;border:1px solid #b6a174;border-radius:5px;font:600 clamp(12px,2.2vw,16px) system-ui}
#setup .setup-controls{display:flex;gap:8px;margin-top:12px}
#setup .setup-controls button{flex:1}
#setup .setup-controls .button{min-height:44px;font-size:clamp(11px,2vw,15px)}
#status{font-size:11px;color:#eee1c3;margin-top:2px;min-height:16px}
#status.error{color:#ffd3b7}
@media (max-width:570px){.topbar{gap:5px}.preview-tag{font-size:9px}.top-tools button,.top-tools a{padding:7px 6px;font-size:10px}#brand{width:min(94vw,550px);max-height:22dvh}.button{gap:6px;padding:8px 6px}.button.small{padding:5px 3px}.menu{gap:8px;margin-bottom:4px}#intro{max-width:92vw}}
@media(max-height:710px){#brand{max-height:19dvh;margin-top:0}#intro{font-size:11px;line-height:1.2;margin-top:2px}#tagline{margin:1px 0}.button.primary{min-height:53px;font-size:21px}.button.dark{min-height:42px}.button.small{min-height:31px}.menu{gap:6px}.grow{min-height:5px}#setup{max-height:60dvh}}
@media(max-height:490px){#brand{max-height:16dvh;width:min(48vw,480px)}#intro{display:none}.topbar{position:relative}.button.primary{min-height:40px;font-size:17px}.button.dark{min-height:34px}.menu{gap:4px}.button.small{min-height:29px}.grow{min-height:1px}}
</style>
</head>
<body>
<div id="vista" aria-hidden="true"></div><div id="shade"></div>
<main id="app">
 <header class="topbar">
  <span class="preview-tag">PROVA · FONS DEL MOTOR 3D</span>
  <div class="top-tools"><button id="toggleAnimation" type="button" aria-pressed="true">Mar animat</button><a href="index.html">Joc actual</a></div>
 </header>
 <h1 id="brand"><img src="assets/hunter-logo.webp" alt="Hunter: Arxipèlag" width="1100" height="367"></h1>
 <p id="tagline">CAÇA. EXPLORA. SOBREVIU.</p>
 <p id="intro"><span>Un arxipèlag salvatge, operacions sense límits.</span><span>Cada missió és una nova història.</span></p>
 <div class="grow"></div>
 <nav id="home" class="menu" aria-label="Prova visual de portada">
  <button class="button primary" id="newGame" type="button"><b>✦</b> NOVA PARTIDA <b>▶</b></button>
  <div class="actions"><a class="button dark" href="index.html" title="Obre el menú actual per continuar">▶ CONTINUAR</a><a class="button dark" href="index.html" title="Obre el menú actual per al cooperatiu">♟ COOPERATIU</a></div>
  <div class="mini-actions"><a class="button small" href="index.html">▥ ESTADÍSTIQUES</a><a class="button small" href="index.html">♙ COMPTE</a><a class="button small" href="index.html">⚙ OPCIONS</a></div>
 </nav>
 <section id="setup" class="menu" hidden aria-label="Prova del generador de missió">
  <h2>⚑ CONFIGURACIÓ DE LA MISSIÓ</h2>
  <div class="row"><label for="difficulty">Dificultat</label><select id="difficulty"><option>Fàcil</option><option selected>Normal</option><option>Difícil</option></select></div>
  <div class="row"><label for="mapSize">Àrea d'operacions</label><select id="mapSize"><option>Petit · 4,8 km</option><option>Gran · 9,6 km</option></select></div>
  <div class="row"><label for="seed">Llavor</label><input id="seed" placeholder="Aleatòria" inputmode="numeric"></div>
  <div class="row"><label for="graphics">Gràfics</label><select id="graphics"><option selected>Alts</option><option>Reduïts</option><option>Mínims</option></select></div>
  <div class="setup-controls"><button class="button dark" id="back" type="button">← TORNAR</button><a class="button primary" href="index.html" title="Aquesta prova no substitueix el menú jugable">JOC ACTUAL ▶</a></div>
 </section>
 <p id="status" role="status" aria-live="polite">Fons estàtic mentre es prepara el paisatge 3D…</p>
</main>
<script type="module" src="src/menu-motor-preview.mjs"></script>
</body></html>
