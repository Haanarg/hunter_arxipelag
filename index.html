<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a5a;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));color:#fff;font-size:12px;line-height:1.5;text-shadow:0 1px 3px #000a;pointer-events:none}
#mm{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:130px;height:130px;border:2px solid #fffa;border-radius:6px}
.p{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.p b{width:58px;height:58px;border-radius:50%;background:#0008;border:2px solid #fffb;color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #0006}

#joystick:after{content:'';position:absolute;inset:24%;border-radius:50%;border:1px solid #ffffff22}
.joy-knob{position:absolute;left:50%;top:50%;width:64px;height:64px;border-radius:50%;background:#ffffff42;border:2px solid #ffffffcc;box-shadow:0 4px 12px #0008;transform:translate(-50%,-50%);pointer-events:none}

#gamepanel .card.inventory-card{width:min(940px,92vw);max-width:940px;background:#1f2930;padding:18px}
.inv-wrap{display:grid;grid-template-columns:minmax(280px,1.25fr) minmax(220px,.75fr);gap:18px}
.inv-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.inv-grid{display:grid;grid-template-columns:repeat(5,minmax(54px,1fr));gap:9px}
.inv-slot{aspect-ratio:1;border:1px solid #7f8c92;background:#10171bcc;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;font-size:30px;cursor:pointer}
.inv-slot.selected{outline:2px solid #f0c86a;background:#28343a}
.inv-count{position:absolute;right:5px;bottom:3px;font:700 13px system-ui;background:#0009;border-radius:5px;padding:1px 5px}
.inv-detail{background:#12191ddd;border:1px solid #58656a;border-radius:10px;padding:18px;min-height:310px;display:flex;flex-direction:column}
.inv-icon{font-size:74px;line-height:1;text-align:center;margin:8px 0 20px}
.inv-detail h3{font-size:22px;margin:0 0 8px}.inv-detail p{line-height:1.45;opacity:.9}
.inv-slot svg{width:42px;height:42px;display:block}.inv-icon svg{width:86px;height:86px;display:block;margin:auto}@media(max-width:700px){#gamepanel .card.inventory-card{width:min(96vw,620px);padding:12px}.inv-wrap{grid-template-columns:1fr}.inv-grid{grid-template-columns:repeat(4,minmax(48px,1fr))}.inv-detail{min-height:180px}.inv-icon{font-size:52px;margin:4px 0 10px}}</style></head><body>
